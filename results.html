<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Past Events & Winners | Gamma House</title>
  <meta name="description" content="Gamma House results, house points, and winners.">
  <meta name="theme-color" content="#1D4ED8">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Permanent+Marker&family=Space+Grotesk:wght@500;700&family=Unbounded:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-page="results">
  <a class="skip" href="#main">Skip to content</a>
  <header class="nav" id="site-header"></header>
  <main id="main">
    <section class="page-hero">
      <div class="page-hero__bg" style="background-image:url('images/gallery/gamma-flag.jpg')" aria-hidden="true"></div>
      <div class="wrap page-hero__inner">
        <p class="eyebrow eyebrow--light">Wall of winners</p>
        <h1>Past Events &amp; Winners</h1>
        <p class="page-hero__lede">House points, every Gamma podium finish, and the Co-Curricular Cup we are defending.</p>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="cup" id="cup"></div>

        <div class="standings-card">
          <div class="standings-card__head">
            <div><p class="eyebrow">House points</p><h2>The standings</h2></div>
            <p class="standings-card__rule" id="points-rule"></p>
          </div>
          <div class="standings">
            <div class="podium" id="podium" aria-label="House points podium"></div>
            <div class="board" id="board"></div>
          </div>
        </div>

        <div class="mvp" id="mvp"></div>

        <div class="results-head">
          <h2>Event results</h2>
          <div class="chips" role="group" aria-label="Filter results by category" data-target="results"></div>
        </div>
        <div class="results" id="results-list"></div>
      </div>
    </section>
  </main>
  <footer class="footer" id="site-footer"></footer>

  <dialog class="modal" id="event-modal" aria-labelledby="modal-title">
    <div class="modal__body" id="modal-body"></div>
    <form method="dialog"><button class="modal__close" aria-label="Close">×</button></form>
  </dialog>
  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <img id="lb-img" alt="">
    <p id="lb-cap"></p>
    <button class="lb-nav lb-prev" aria-label="Previous photo">‹</button>
    <button class="lb-nav lb-next" aria-label="Next photo">›</button>
    <form method="dialog"><button class="modal__close" aria-label="Close">×</button></form>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
